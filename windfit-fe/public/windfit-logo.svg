<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <!-- Outer Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="80%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <!-- Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Outer Ring with Shadow -->
  <circle cx="80" cy="80" r="74" fill="none" stroke="url(#goldGrad)" stroke-width="2" filter="url(#shadow)" />
  <circle cx="80" cy="80" r="71" fill="none" stroke="url(#ringGrad)" stroke-width="4.5" />
  <circle cx="80" cy="80" r="67" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" />
  
  <!-- Inner White Background -->
  <circle cx="80" cy="80" r="66" fill="#ffffff" />
  
  <!-- Subtle circular texture/ring -->
  <circle cx="80" cy="80" r="60" fill="none" stroke="#f1f5f9" stroke-width="1" />

  <!-- Shield Base -->
  <path d="M 80 28 Q 106 28 112 40 Q 112 75 80 102 Q 48 75 48 40 Q 54 28 80 28 Z" 
        fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />

  <!-- Gold Wings / Wind Swooshes -->
  <!-- Left Wing -->
  <path d="M 80 44 C 70 42 58 48 54 58 C 64 56 74 60 78 68 C 76 60 76 52 80 44 Z" 
        fill="url(#goldGrad)" />
  <!-- Right Wing -->
  <path d="M 80 44 C 90 42 102 48 106 58 C 96 56 86 60 82 68 C 84 60 84 52 80 44 Z" 
        fill="url(#goldGrad)" />
  
  <!-- Center Chevron Wind Crest -->
  <path d="M 80 50 L 92 64 L 86 66 L 80 58 L 74 66 L 68 64 Z" fill="#ffffff" opacity="0.9" />
  <path d="M 80 62 L 90 74 L 84 76 L 80 70 L 76 76 L 70 74 Z" fill="url(#goldGrad)" />

  <!-- Banner for WINDFIT -->
  <path d="M 44 88 L 116 88 L 110 102 L 50 102 Z" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="1.2" />
  <text x="80" y="99" 
        text-anchor="middle" 
        fill="#fde047" 
        font-family="'Plus Jakarta Sans', Arial, sans-serif" 
        font-size="11" 
        font-weight="900" 
        letter-spacing="2">WINDFIT</text>

  <!-- Stars under banner -->
  <circle cx="70" cy="108" r="1.5" fill="#ca8a04"/>
  <polygon points="80,105 82,109 86,109 83,111 84,115 80,113 76,115 77,111 74,109 78,109" fill="url(#goldGrad)" />
  <circle cx="90" cy="108" r="1.5" fill="#ca8a04"/>
</svg>
